:root{--soil:#dec08d;--soil-2:#e6cda3;--ink:#191b1c;--ink-dim:#4a4237;--rule:rgba(25,27,28,.22);--f:"Gellix","Helvetica Neue",Arial,sans-serif;color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--soil);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:14px 32px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px}.brand .mono{height:26px;width:auto}.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.snd{font-size:13px;padding:6px 12px;border:1px solid var(--rule);border-radius:999px}.snd[aria-pressed="false"]{opacity:.6}
.ghead{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px;gap:10px}
h1{font-size:26px;font-weight:500;margin:0;letter-spacing:-.01em;line-height:1.1}
h2{font-size:24px;font-weight:500;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.pips{display:flex;gap:6px}.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);display:inline-block}.pips i.on{background:var(--ink)}
.edge{position:relative;aspect-ratio:4/5;width:min(100%,calc((100svh - 130px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .8));margin-inline:auto;border-radius:16px;background:#191b1c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.edge canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(25,27,28,.88);color:#fffaf0;padding:24px;text-align:center}
.over>div{max-width:330px;display:grid;gap:12px;justify-items:center}
.over p,.over .tag{color:#a9aaa6;font-size:15px}.over .tag{font-size:11px}
.bigo{font-size:56px;color:#dec08d;line-height:1;letter-spacing:-.02em}.bigo.bad{color:#c98a5e}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn{padding:11px 18px;border:1px solid rgba(255,250,240,.28);border-radius:999px;font-size:14px;color:#fffaf0}
.btn.main{background:#fffaf0;color:#191b1c;border-color:#fffaf0}
.best{font-size:13px}
.tune{margin-top:16px;font-size:14px}
.tune summary{cursor:pointer;font-weight:500;display:inline-flex;gap:6px;padding:10px 16px;border:1px solid var(--rule);border-radius:999px;list-style:none}
.tune summary::-webkit-details-marker{display:none}
.tune[open]{padding:14px;border:1px dashed var(--rule);border-radius:14px}.tune[open] summary{border-color:transparent;padding:0 0 4px}
.tune label{display:grid;grid-template-columns:1fr 1.2fr 44px;gap:10px;align-items:center;margin-top:12px;color:var(--ink-dim)}
.tune input{width:100%;accent-color:var(--ink)}.tune output{text-align:right;font-variant-numeric:tabular-nums}
.tune .btn2{margin-top:12px;padding:9px 14px;border:1px solid var(--rule);border-radius:999px;font-size:13px}
.dim{color:var(--ink-dim)}
.turn{display:none}
@media (orientation:landscape) and (max-height:520px){.turn{display:grid;position:fixed;inset:0;z-index:20;place-items:center;background:#191b1c;color:#fffaf0;text-align:center;padding:24px}
 .turn>div{display:grid;gap:10px;justify-items:center}.turn svg{width:56px;height:56px;animation:tilt 1.6s ease-in-out infinite}.turn b{font-weight:500;font-size:20px}.turn span{color:#a9aaa6;font-size:14px}}
@keyframes tilt{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
.edge .over h2{color:#fffaf0}
.tcard{position:absolute;left:3%;right:3%;top:2.5%;display:grid;gap:4px;padding:10px 12px;border-radius:14px;background:rgba(25,27,28,.94);border:1px solid rgba(255,250,240,.16);color:#fffaf0;z-index:2}
.tcard .tag{font-size:10px;color:#a9aaa6}
.tcard b{font-weight:500;font-size:clamp(15px,4.2vw,19px);line-height:1.15}
.tcard p{font-size:clamp(12px,3.3vw,14px);color:#c9c9c4;line-height:1.3}
.tcard .trow{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:4px}.tcard .trow .tag{margin-right:auto}
.tcard .tb{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,250,240,.28);font-size:13px;color:#fffaf0}
.tcard .tb.main{background:#fffaf0;color:#191b1c;border-color:#fffaf0}
.pips.hl i{box-shadow:0 0 0 3px rgba(25,27,28,.25);animation:pp 1s ease-in-out infinite alternate}
@keyframes pp{to{transform:scale(1.25)}}
.edge,.edge *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* best score only; the full platform keeps daily results */
const results=()=>({edge:store.get("ote-best",null)});
const saveResult=(g,r)=>store.set("ote-best",r);
const MONO=`<svg class="mono" viewBox="0 0 52.67 65.87" aria-hidden="true"><path fill="currentColor" d="M9.12,38.49v-11.1h34.42v11.1H9.12ZM43.55,19.95H9.12V0H0v65.87h9.12v-19.95h34.42v19.95h9.12V0h-9.12v19.95Z"/></svg>`;
const TUNE_DEF={room:17,grip:38,wobble:.85,speed:1.45};
let TUNE=Object.assign({},TUNE_DEF,store.get("ote-tune",{}));
const TUNE_UI=[["room","Start distance from the edge","cm",8,28,1],["grip","Thumb grip","",16,56,2],["speed","Fall speed","",1.1,2.4,.1],["wobble","Wobble strength","×",.5,2,.1]];
/* ---------- sound and touch feedback (bonus round) ---------- */
const SFX=(()=>{let ac=null,on=store.get("ote-sound",true);
 function audio(){try{try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
   if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A()}if(ac.state!=="running")ac.resume()}catch(e){return null}return ac}
 function unlock(){const a=audio();if(!a)return;try{const b=a.createBuffer(1,1,22050),n=a.createBufferSource();n.buffer=b;n.connect(a.destination);n.start(0)}catch(e){}}
 function noise(a,t,dur,freq,level,out){const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const n=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();n.buffer=b;f.type="highpass";f.frequency.value=freq;g.gain.value=level;n.connect(f);f.connect(g);g.connect(out);n.start(t)}
 // a glass "clink": a few inharmonic partials with a fast decay, plus a tiny tap transient
 function clink(level=1,pitch=1,ring=1){if(!on)return;const a=audio();if(!a)return;const t=a.currentTime,out=a.createGain();out.gain.value=.2*level;out.connect(a.destination);
  [[2093,1],[3180,.5],[4410,.32],[5680,.18],[7050,.1]].forEach(([f,g],i)=>{const o=a.createOscillator(),e=a.createGain();o.type="sine";o.frequency.value=f*pitch*(1+(Math.random()-.5)*.012);
   e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.002);e.gain.exponentialRampToValueAtTime(.0001,t+(.18+.22/(i+1))*ring);o.connect(e);e.connect(out);o.start(t);o.stop(t+.8*ring)});
  noise(a,t,.015,3500,.5,out)}
 // a wooden "clonk": a low body thump that drops in pitch, a short knock of filtered noise, then a smaller bounce
 function knock(a,t,f,level,out){const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(level,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(out);o.start(t);o.stop(t+.25);
  const o2=a.createOscillator(),g2=a.createGain();o2.type="triangle";o2.frequency.setValueAtTime(f*2.7,t);g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(level*.35,t+.002);g2.gain.exponentialRampToValueAtTime(.0001,t+.07);o2.connect(g2);g2.connect(out);o2.start(t);o2.stop(t+.1);
  const b=a.createBuffer(1,Math.max(1,a.sampleRate*.05),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const n=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();n.buffer=b;bp.type="bandpass";bp.frequency.value=f*4;bp.Q.value=1.4;ng.gain.value=level*.8;n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t)}
 function smash(){if(!on)return;const a=audio();if(!a)return;const t=a.currentTime,out=a.createGain();out.gain.value=.5;out.connect(a.destination);
  knock(a,t,165,1,out);knock(a,t+.13,190,.45,out);knock(a,t+.21,200,.18,out)}
 function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
 return {unlock,clink,smash,buzz,get on(){return on},set on(v){on=v;store.set("ote-sound",v)}}})();
const isLandscapePhone=()=>matchMedia("(orientation: landscape) and (max-height: 520px)").matches;

let edgeRun=null;
function edgeStop(){if(edgeRun){edgeRun.dead=true;cancelAnimationFrame(edgeRun.raf);edgeRun.cleanup();edgeRun=null}}
function page(){
 $("#app").innerHTML=`<div class="bar"><span class="brand">${MONO}<small>Hawkstone · test build</small></span><button class="snd" id="snd" aria-pressed="${SFX.on}">${SFX.on?"Sound on":"Sound off"}</button></div>
  <div class="ghead"><h1>On the Edge</h1><span class="pips" id="pips" aria-label="Saves"></span></div>
  <div class="edge" id="edge"><canvas id="ecv"></canvas><div class="tcard" id="et" hidden></div><div class="over" id="eo"></div></div>
  <p class="msg" id="em" hidden></p>

 // the stabiliser: drag anywhere on the grey strip, the knob follows your thumb
